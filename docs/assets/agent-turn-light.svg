<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 884" width="1320" height="884" role="img" aria-labelledby="at-title at-desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="at-title">ShiftMind agent turn</title>
  <desc id="at-desc">A planner message goes to the Jev turn router, which classifies it as scheduling, direct or out_of_scope. A special route is taken only at probability 0.85 or higher; any router error, timeout or missing key falls back to scheduling. The direct and out_of_scope routes run the agent with no tools; out_of_scope can only refuse, with fixed copy. The scheduling route runs the agent with its granted capability tools, whose results become trusted evidence, and validators force corrective retries on uncited or malformed claims. The run ends in one typed output: an answer passes the grounding gate and then a Jev claim check that flags weak wording without removing it; a clarification is bound to real scenario IDs; a draft is bound to the trusted tool result; a refusal keeps a closed reason and bounded copy; an approval-gated call suspends the turn into an exact-action approval request. A failed run maps to fixed planner copy, still returning any draft already saved. Every path ends as a persisted activity streamed to the planner's chat.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626" />
    </marker>
  </defs>

