  <text x="540" y="214.5" text-anchor="middle" fill="#6b7280" font-size="11.5px">a special route only when p ≥ 0.85;</text>
  <text x="540" y="233.5" text-anchor="middle" fill="#6b7280" font-size="11.5px">error, timeout or no key → scheduling</text>
