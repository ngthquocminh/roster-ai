<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 910" width="1320" height="910" role="img" aria-labelledby="ab-title ab-desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="ab-title">ShiftMind authority boundary</title>
  <desc id="ab-desc">Untrusted planner text, scenario data and conversation history reach a language model, which emits only a typed proposal across a trust boundary. On the application side a gate re-derives actor and site from the session, capability and risk class from the registry, budgets and approval rules from policy, and current scenario and baseline versions, then either rejects with a named outcome or forwards to one of two paths. The read path uses an application calculator and version-bound evidence to produce a grounded answer. The write path runs CP-SAT in a leased, fenced worker, produces an immutable candidate version, requires an exact-action approval, and atomically moves the baseline pointer while writing audit and the persisted event. PostgreSQL row-level security sits beneath the whole application side.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="910" fill="#ffffff" />

  
  <path d="M512,28 L512,806" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="9 7" />
  <text x="24" y="46" fill="#6b7280" font-size="11.5px" font-weight="700" letter-spacing=".13em">UNTRUSTED  ·  INPUT, NOT INSTRUCTION</text>
  <text x="540" y="46" fill="#6b7280" font-size="11.5px" font-weight="700" letter-spacing=".13em">APPLICATION AUTHORITY  ·  RE-RESOLVED PER REQUEST</text>

  
  <rect x="24" y="120" width="182" height="42" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4" rx="7" />
  <text x="115" y="146" text-anchor="middle" fill="#111827" font-size="13.5px">planner text</text>

  <rect x="24" y="176" width="182" height="42" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4" rx="7" />
  <text x="115" y="202" text-anchor="middle" fill="#111827" font-size="13.5px">scenario data</text>

  <rect x="24" y="232" width="182" height="42" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4" rx="7" />
  <text x="115" y="258" text-anchor="middle" fill="#111827" font-size="13.5px">conversation history</text>

  
  <rect x="264" y="152" width="170" height="90" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="349" y="188" text-anchor="middle" fill="#111827" font-size="13.5px" font-weight="600">LLM</text>
  <text x="349" y="209" text-anchor="middle" fill="#6b7280" font-size="11.5px">PydanticAI</text>
  <text x="349" y="226" text-anchor="middle" fill="#6b7280" font-size="11.5px">interprets · proposes</text>

  <path d="M206,141 L232,141 L232,182 L260,182" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M206,197 L260,197" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M206,253 L232,253 L232,212 L260,212" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  
  <text x="24" y="316" fill="#6b7280" font-size="11.5px">Model output is never authority.</text>
  <text x="24" y="334" fill="#6b7280" font-size="11.5px">Hidden provider reasoning is discarded.</text>
  <text x="24" y="352" fill="#6b7280" font-size="11.5px">No SQL, shell, filesystem, credential</text>
  <text x="24" y="370" fill="#6b7280" font-size="11.5px">or network reach exists to be hijacked.</text>

  
  <rect x="24" y="436" width="440" height="192" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2" rx="8" />
  <text x="44" y="466" fill="#111827" font-size="13.5px" font-weight="600">How to read this</text>
  <text x="44" y="494" fill="#6b7280" font-size="11.5px">1 ·  Everything left of the dashed line is input —</text>
  <text x="44" y="512" fill="#6b7280" font-size="11.5px">     including the model's own output.</text>
  <text x="44" y="538" fill="#6b7280" font-size="11.5px">2 ·  Every arrow entering the gate from above comes</text>
  <text x="44" y="556" fill="#6b7280" font-size="11.5px">     from a source the model cannot reach or forge.</text>
  <text x="44" y="582" fill="#6b7280" font-size="11.5px">3 ·  The red paths are the point: a rejection carries a</text>
  <text x="44" y="600" fill="#6b7280" font-size="11.5px">     name, and no partial effect is ever committed.</text>

  
  <path d="M434,197 L596,197" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="458" y="163" width="114" height="20" fill="#ffffff" />
  <text x="515" y="178" text-anchor="middle" fill="#6b7280" font-size="11.5px" font-style="italic">typed proposal</text>

  
  <rect x="540" y="66" width="176" height="62" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="628" y="88" text-anchor="middle" fill="#6b7280" font-size="11.5px">session</text>
  <text x="628" y="110" text-anchor="middle" fill="#111827" font-size="13.5px">actor + site</text>

  <rect x="727" y="66" width="176" height="62" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="815" y="88" text-anchor="middle" fill="#6b7280" font-size="11.5px">registry</text>
  <text x="815" y="110" text-anchor="middle" fill="#111827" font-size="13.5px">capability + risk</text>

  <rect x="914" y="66" width="176" height="62" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="1002" y="88" text-anchor="middle" fill="#6b7280" font-size="11.5px">policy</text>
  <text x="1002" y="110" text-anchor="middle" fill="#111827" font-size="13.5px">budgets + approval</text>

  <rect x="1101" y="66" width="176" height="62" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="1189" y="88" text-anchor="middle" fill="#6b7280" font-size="11.5px">versions</text>
  <text x="1189" y="110" text-anchor="middle" fill="#111827" font-size="13.5px">scenario + baseline</text>

  
  <rect x="596" y="168" width="344" height="104" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="8" />
  <text x="768" y="202" text-anchor="middle" fill="#3730a3" font-size="15px" font-weight="700">GATE</text>
  <text x="768" y="226" text-anchor="middle" fill="#3730a3" font-size="12px">validate · authorize · check version</text>
  <text x="768" y="246" text-anchor="middle" fill="#3730a3" font-size="12px">spend budget · require approval</text>

  <path d="M628,128 L628,152 L690,152 L690,164" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M815,128 L815,164" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M1002,128 L1002,152 L860,152 L860,164" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M1189,128 L1189,158 L905,158 L905,164" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  
  <rect x="988" y="176" width="300" height="196" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" rx="8" />
  <text x="1004" y="200" fill="#991b1b" font-size="12.5px" font-weight="700">FAIL CLOSED  →  named outcome</text>
  <text x="1004" y="226" fill="#991b1b" font-size="11.5px">model_citation_missing</text>
  <text x="1004" y="248" fill="#991b1b" font-size="11.5px">argument_mismatch</text>
  <text x="1004" y="270" fill="#991b1b" font-size="11.5px">stale_scenario_version</text>
  <text x="1004" y="292" fill="#991b1b" font-size="11.5px">evidence_unauthorized</text>
  <text x="1004" y="314" fill="#991b1b" font-size="11.5px">calculation_failed</text>
  <text x="1004" y="336" fill="#991b1b" font-size="11.5px">budget_exhausted · timed_out</text>
  <text x="1004" y="360" fill="#6b7280" font-size="11.5px">no partial effect is ever committed</text>
  <path d="M940,220 L984,220" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#aw)" />

  
  <path d="M768,272 L768,406" fill="none" stroke="#9ca3af" stroke-width="1.6" />
  <path d="M768,406 L648,406 L648,432" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />
  <path d="M768,406 L1000,406 L1000,432" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  <text x="540" y="400" fill="#6b7280" font-size="11.5px" font-weight="700" letter-spacing=".1em">READ PATH</text>
  <text x="1088" y="400" fill="#6b7280" font-size="11.5px" font-weight="700" letter-spacing=".1em">WRITE PATH</text>

  
  <rect x="540" y="436" width="216" height="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="648" y="466" text-anchor="middle" fill="#111827" font-size="13.5px">application calculator</text>
  <text x="648" y="488" text-anchor="middle" fill="#6b7280" font-size="11.5px">+ version-bound evidence</text>
  <text x="648" y="505" text-anchor="middle" fill="#6b7280" font-size="11.5px">row count proven</text>

  <rect x="540" y="560" width="216" height="72" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="648" y="588" text-anchor="middle" fill="#111827" font-size="13.5px">grounded answer</text>
  <text x="648" y="610" text-anchor="middle" fill="#6b7280" font-size="11.5px">value supplied by the app,</text>
  <text x="648" y="626" text-anchor="middle" fill="#6b7280" font-size="11.5px">never by the model</text>
  <path d="M648,514 L648,556" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  <text x="540" y="664" fill="#6b7280" font-size="11.5px">The read path cannot</text>
  <text x="540" y="681" fill="#6b7280" font-size="11.5px">produce an effect.</text>

  
  <rect x="892" y="436" width="216" height="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="1000" y="466" text-anchor="middle" fill="#111827" font-size="13.5px">CP-SAT solve</text>
  <text x="1000" y="488" text-anchor="middle" fill="#6b7280" font-size="11.5px">separate worker · leased</text>
  <text x="1000" y="505" text-anchor="middle" fill="#6b7280" font-size="11.5px">heartbeat + fencing epoch</text>

  <rect x="892" y="546" width="216" height="58" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="1000" y="571" text-anchor="middle" fill="#111827" font-size="13.5px">immutable candidate</text>
  <text x="1000" y="591" text-anchor="middle" fill="#6b7280" font-size="11.5px">schedule version</text>
  <path d="M1000,514 L1000,542" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  <rect x="892" y="636" width="216" height="74" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="8" />
  <text x="1000" y="662" text-anchor="middle" font-weight="700" fill="#3730a3" font-size="12px">exact-action approval</text>
  <text x="1000" y="682" text-anchor="middle" fill="#3730a3" font-size="12px">bound to actor, candidate,</text>
  <text x="1000" y="699" text-anchor="middle" fill="#3730a3" font-size="12px">baseline, param + policy hash</text>
  <path d="M1000,604 L1000,632" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  <path d="M1108,673 L1152,673" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#aw)" />
  <text x="1158" y="662" fill="#991b1b" font-size="11.5px">expired ·</text>
  <text x="1158" y="678" fill="#991b1b" font-size="11.5px">hash mismatch</text>
  <text x="1158" y="694" fill="#991b1b" font-size="11.5px">→ stays pending</text>

  <rect x="860" y="742" width="280" height="48" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="7" />
  <text x="1000" y="763" text-anchor="middle" fill="#111827" font-size="13.5px">atomic commit</text>
  <text x="1000" y="782" text-anchor="middle" fill="#6b7280" font-size="11.5px">baseline pointer + audit_event + event</text>
  <path d="M1000,710 L1000,738" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)" />

  
  <rect x="540" y="820" width="748" height="66" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2" rx="8" />
  <text x="914" y="846" text-anchor="middle" fill="#111827" font-size="13.5px" font-weight="600">PostgreSQL · row-level security ENABLE + FORCE on every site_id table</text>
  <text x="914" y="868" text-anchor="middle" fill="#6b7280" font-size="11.5px">least-privilege roles · no runtime role owns a table or can bypass RLS · an authorization bug is not a cross-tenant breach</text>
</svg>
