# Team overrides for bmad-code-review. Committed — applies to every developer.
# Arrays append to the base list in
# `.claude/skills/bmad-code-review/customize.toml`.

[workflow]

# Review is where the demand family/unit rule actually cost this project: five
# of Story 2.7's nine decision-grade findings were that one rule, raised after
# the code was written (epic-1-2-retro-2026-08-16.md §3.2). The reviewer holds
# the rule from activation so a dimensional error is caught as a deviation from
# a written contract rather than adjudicated from scratch mid-review.

persistent_facts = [
  "file:{project-root}/docs/DOMAIN-MODEL.md",
  "docs/DOMAIN-MODEL.md is normative for demand families, units, and assignments. A finding about a metric's dimension cites the doc's rule; it does not re-derive it. If the code and the doc disagree, that disagreement IS the finding — say which one is wrong.",
  "Never report 'that planner question is invalid' for a headcount or staffing question about outbound/inbound work. It is valid and is answered from assignments, which are family-agnostic. Only required-demand-in-minutes is unanswerable for those families.",
  "Every new guard or invariant in the diff must appear in the story's Dev Agent Record mutation table ('mutation applied to real code', 'guard that should redden', 'before', 'after'). A missing table is itself a finding. Do NOT stop at reading it: independently mutate at least ONE delivered guard and confirm it reddens for the stated reason, then revert. If it stays green while the table says it went red, that is a decision-grade finding and the rest of the table is suspect. Reading the table alone would trade detection for paperwork — Story 4.6's Task 4 checkbox was ticked, and all five of its decision-grade findings were guards that could not go red, found only because the reviewer ran the mutations.",
]
