server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. A static `proxy_pass http://api:8000` is resolved
    # once at config load, so recreating the api container with a new bridge
    # IP would 502 every request until nginx reloaded. Resolving through a
    # variable defers the lookup to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The agent-run and schedule-run bodies are small, but the default 1m
    # would reject a large draft before FastAPI could validate it.
    client_max_body_size 16m;

    location = /health {
        set $api_health http://api:8000/health;
        proxy_pass $api_health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events. `api/routers/conversations.py` and
        # `schedule_runs.py` serve `text/event-stream`, and the SPA consumes
        # them with `EventSource` (`hooks/useConversationStream.ts`, reached
        # from `features/chat/ChatView.tsx`). nginx's defaults break that in
        # three separate ways: HTTP/1.0 upstream has no chunked streaming,
        # response buffering holds frames until the buffer fills, and a 60s
        # read timeout cuts an idle stream — which trips the hook's
        # MAX_CONSECUTIVE_FAILURES and drops the UI into its polling fallback.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /oidc/ {
        set $oidc_upstream http://api:8000;
        proxy_pass $oidc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri /index.html;
    }
}
