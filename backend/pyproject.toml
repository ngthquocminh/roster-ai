[project]
name = "rosterai"
version = "0.1.0"
description = "Scheduling Engine for ShiftMind, an AI workforce scheduling assistant"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 9.15 wheel segfaults on the dev machine; 9.11.4210 is the validated pin.
    "ortools==9.11.4210",
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "google-genai>=2.10.0",
    # PydanticAI 2.27 provides its async client through httpx; Anthropic 1.x
    # moved to httpx2, so retain the compatible 0.x SDK line.
    "anthropic>=0.108,<1",
    "openai>=1.40",
    "python-dotenv>=1.2.2",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
    "authlib==1.7.2",
    # Agent runtime (Story 2.1). Exact pin, not a floor: AR27 requires each
    # planned dependency be LOCKED at its implementation gate. Replaces AD-19's
    # 2.14.1 seed under its own "a different V2 release may replace the seed
    # only with the same evidence" clause — evidence is the seven-capability
    # spike in backend/spikes/agent_runtime/, verdict in
    # docs/AGENT-RUNTIME-DECISION.md.
    #
    # `-slim` with exactly three extras, never the `pydantic-ai` meta-package:
    # that resolves to [anthropic,cli,evals,google,logfire,mcp,openai,retries,web]
    # and would pull the Logfire SDK, a stack row owned by Story 5.1.
    # The extras mirror the providers already shipped: anthropic -> AgentRuntime,
    # google -> llm/gemini.py, openrouter -> llm/openrouter.py.
    "pydantic-ai-slim[anthropic,google,openrouter]==2.27.0",
    # Trace export (Story 5.9, AR27: locked at this implementation gate). Exact
    # pins, not floors: `adapters/telemetry/spans.py` constructs the
    # instrumentation package's module-level `EngineTracer` directly, and an
    # unpinned upgrade could change its constructor. Story 2.1 carried the SDK
    # as TEST-ONLY so the suite could assert on OBSERVED spans; Story 5.9 ships
    # it because the API and worker now export through it. None of these is
    # the Logfire SDK -- `logfire` is never a runtime dependency (spine Stack).
    # Every span passes `SanitizingSpanExporter` before it leaves the process.
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    # Required by fastapi.testclient.TestClient, and since Story 5.9 a
    # runtime-instrumented library (pydantic-ai's provider clients use it), so
    # it is declared here rather than arriving only transitively.
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    # TEST-ONLY (Story 5.8). `behavioral_digest` parses the tracked compose
    # override's `environment` maps so the price keys can be excluded from the
    # digest the live-conversation drop check compares on. Deliberately in the
    # dev group, never [project].dependencies. NOTE (corrected at review):
    # pyyaml already arrives transitively via uvicorn[standard]'s "standard"
    # extra even under `Dockerfile:13`'s `uv sync --no-dev` -- the original
    # "yaml is absent at runtime" claim here was wrong. It still must never be
    # imported outside `backend/evals/`: relying on an unrelated package's
    # transitive pull-in from `api`/`worker` code would be fragile if that
    # extra ever changed.
    "pyyaml",
    # EVAL TOOLING ONLY (Story 5.10, AR27: locked at this implementation gate).
    # Dev group, never runtime: the image is built `--no-dev` (spine Stack row:
    # "never imported by api, worker, agent, application or domain"). Once
    # installed, `logfire_api` delegates to the real SDK in every process that
    # imports pydantic-ai; it stays inert unless configured (Story 5.10 fact 3).
    # `logfire 5.x` caps `opentelemetry-sdk<1.45`, so the next OTel bump moves
    # this pin too. Only `evals/live_conversations/logfire_publish.py` imports it.
    "logfire==5.1.0",
    # Must equal `pydantic-ai-slim` exactly: pydantic-evals pins it, so bumping
    # this alone fails `uv lock` and bumping both moves the agent runtime.
    "pydantic-evals==2.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exercises a real network-backed LLM provider; excluded by default (run with `pytest -m live`)",
    "postgres: exercises the local PostgreSQL integration service",
    "compose: exercises the built local stack; invoked through its explicitly named proof file",
]
addopts = "-m \"not live\" -p no:logfire -p no:pytest_logfire"
