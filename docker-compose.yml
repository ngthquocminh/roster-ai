services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rosterai
      POSTGRES_USER: rosterai
      POSTGRES_PASSWORD: rosterai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterai -d rosterai"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
