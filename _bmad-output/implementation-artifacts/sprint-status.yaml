#     thread"). This is THE trap of the story: it fails as an outage, never as a red test.
# (2) HAND-ROLL SSE ON `StreamingResponse`; DO NOT ADD `sse-starlette`. It is absent from the
#     spine's Stack table, so AR27's "add and lock each planned dependency only at its
#     implementation gate" would demand the same AR19/AR27 ceremony Story 2.1 ran for
#     PydanticAI, to buy ~40 lines of formatting. VERIFIED AT CREATION against Starlette's own
#     source: `BaseHTTPMiddleware.body_stream()` does NOT buffer (it yields chunks as they
#     arrive), so both `@app.middleware("http")` layers are transparent; and
#     `StreamingResponse` already raises `ClientDisconnect` — no second watchdog.
# (3) THE REPLAY READ EXTENDS THE EXISTING `ConversationRepository`; NO NEW PORT MODULE.
#     AD-22 gives the conversation aggregate its own events and the DB pins
#     `stream_id = conversation_id`. **This falsifies the deferred-work ledger**, whose
#     story-2-3-creation item nominates Story 2.4 for the `ScenarioCatalogueReader` AD-1 leak
#     on the stated premise that 2.4 "adds the next `application/ports/` module (the
#     SSE/event-stream port)". It does not. Task 10 corrects that entry in place and restates
#     the owner; it deliberately does NOT close the item — the real fix (tier 3) refactors a
#     Gate A read port, its adapter, `api/deps.py` and a router, and this story already carries
#     a threshold that blocks its own acceptance. Tier 1/2 would be worse than nothing: someone
#     would delete the `ALLOWED_LEAKS` entry while the vendor type still sat in the contract.
# (4) A REJECTED CURSOR RETURNS A NON-200 SO `EventSource` FAILS PERMANENTLY. Per WHATWG,
#     EventSource auto-retries on network failure but a non-200 / non-`text/event-stream`
#     response CLOSES it for good. That is the behaviour AC2 needs — and the trap is the
#     inverse: answering a bad cursor with 200 + an error frame makes the browser retry
#     forever with the same poisoned `Last-Event-ID`. The client's `onerror` re-establishes
#     from its own persisted cursor passed as a QUERY PARAM, because EventSource cannot set
#     headers. Precedence fixed: header wins when present, query param is the fallback.
# (5) NON-DISCLOSURE IS CONTROL FLOW, NOT COPYWRITING. When the cursor's `<stream_uuid>` does
#     not match the URL's conversation, reject on the STRING COMPARISON ALONE and issue ZERO
#     queries — a test asserts the repository is never invoked on that path. All three AC2
#     rejection causes (malformed, foreign stream, impossible sequence) return one stable code
#     and one byte-identical body.
#
# THREE TRAPS THAT FAIL SILENTLY, flagged rather than left to be discovered: comparing
# sequences as STRINGS ("10" < "9" drops every event from 10 on for a client resuming at 9 —
# they are `Numeric(38,0)` Decimals and must be compared as such); seeding the first cursor at
# 0 rather than from the timeline's newest item, which replays the entire history the
# tail-anchored 200-item window deliberately truncated, every event arriving as "new"; and
# reaching for `EventSource` in a jsdom test — VERIFIED ABSENT from jsdom's interface registry,
# so the hook takes an injectable constructor rather than acquiring a polyfill dependency.
#
# HONESTY FENCE: the only event type that exists is `planner_message_accepted` — no agent runs,
# nothing leaves `agent_queued`. The live stream's real content is a message accepted by another
# tab plus the sender's own echo beside the mutation refetch, which is what makes the UX-DR6
# dedup test meaningful rather than theoretical. UX-DR5 forbids dressing that up: no typing
# indicator, no synthetic progress frames, no placeholder event types. NFR35 is a GATE B row
# (epics.md:1522), so the new evidence file is NOT registered in the Gate A registry — the
# repo-wide `test_evidence_convention.py` sweep picks it up automatically. It is a NEW evidence
# file, so `regenerate_evidence.py` cannot bootstrap it (that script rewrites files that already
# exist); follow `backend/evals/report.py`'s resolve-bindings-then-write pattern, then register
# it in `EVIDENCE_FILES` + `_MEASUREMENT_MARKERS`. `backend/agent/**`, `backend/services/**`,
# `backend/migrations/**` and `test_gate_a_mutation_audit.py` must show a ZERO-LINE diff.

