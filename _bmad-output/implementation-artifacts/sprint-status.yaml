#     written; 2.27.0 is current. All seven AC1 capabilities were confirmed
#     present at BOTH tags before choosing. Verified compatibility at 7f268e0:
#     pydantic-ai-slim 2.27.0 needs python>=3.10 (venv is 3.10.9),
#     pydantic>=2.12 (locked 2.13.4), openai>=2.45.0 (locked EXACTLY 2.45.0),
#     google-genai>=1.70.0 (locked 2.10.0), httpx>=0.27 (0.28.1),
#     anyio>=4.7.0 (4.14.1) — no resolver conflict, but the openai floor is
