# landed 1.6-1.9 surface: (a) no global prefers-reduced-motion handling (only
# ui/skeleton.tsx is guarded; Radix dialog/select/tooltip/tabs animate
# unguarded), and (b) no viewport-responsive behavior in Scenario Data (one
# `sm:` class exists in the entire features/ + routes/ tree). It also introduces
# Playwright + axe-core as new frontend devDependencies, because 200% zoom,
# reflow, text-spacing, and 44x44 touch targets are unprovable in jsdom. That
# tooling decision is flagged as Open Question #1 in the story for reviewer
# sign-off; the documented fallback is Layer-A-only with every browser check
# recorded as deferred to Story 4.9 — never a silent jsdom-only pass.

