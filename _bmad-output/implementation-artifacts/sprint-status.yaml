#
# THREE TRAPS THAT FAIL SILENTLY, flagged rather than left to be discovered: comparing
# sequences as STRINGS ("10" < "9" drops every event from 10 on for a client resuming at 9 —
# they are `Numeric(38,0)` Decimals and must be compared as such); seeding the first cursor at
# 0 rather than from the timeline's newest item, which replays the entire history the
# tail-anchored 200-item window deliberately truncated, every event arriving as "new"; and
# reaching for `EventSource` in a jsdom test — VERIFIED ABSENT from jsdom's interface registry,
# so the hook takes an injectable constructor rather than acquiring a polyfill dependency.
#
# HONESTY FENCE: the only event type that exists is `planner_message_accepted` — no agent runs,
# nothing leaves `agent_queued`. The live stream's real content is a message accepted by another
# tab plus the sender's own echo beside the mutation refetch, which is what makes the UX-DR6
# dedup test meaningful rather than theoretical. UX-DR5 forbids dressing that up: no typing
# indicator, no synthetic progress frames, no placeholder event types. NFR35 is a GATE B row
# (epics.md:1522), so the new evidence file is NOT registered in the Gate A registry — the
# repo-wide `test_evidence_convention.py` sweep picks it up automatically. It is a NEW evidence
# file, so `regenerate_evidence.py` cannot bootstrap it (that script rewrites files that already
# exist); follow `backend/evals/report.py`'s resolve-bindings-then-write pattern, then register
# it in `EVIDENCE_FILES` + `_MEASUREMENT_MARKERS`. `backend/agent/**`, `backend/services/**`,
# `backend/migrations/**` and `test_gate_a_mutation_audit.py` must show a ZERO-LINE diff.

# NOTE (2026-08-10): Story 2-3 created and moved to ready-for-dev. It is the FIRST
# planner-visible Epic 2 feature and the FIRST story in the repo that writes to
# governed PostgreSQL from a request — every prior story was read-only by
# construction under Gate A / AD-4. That one fact generates most of its risk.
#
# FOUR DECISIONS WERE MADE AT CREATION and are recorded in the story:
# (1) CONVERSATION ROUTES MOUNT AT `/api/v1/conversations`, NOT under
#     `/api/v1/scenarios`. VERIFIED AT CREATION:
#     `backend/tests/test_gate_a_mutation_audit.py:25` asserts EVERY path
#     starting `/api/v1/scenarios` exposes only `get`. A
#     `POST /api/v1/scenarios/{id}/conversations` turns that Gate A test red,
#     and AR28 forbids a later gate weakening an earlier one — editing the
#     assertion would gut AD-4's "no scenario-source mutation route" proof that
#     Story 1.9 built. Mounting elsewhere is also correct under AD-22, which
#     gives `conversation` its own aggregate owner distinct from `scenario`.
# (2) THIS STORY ACCEPTS AND PERSISTS A TURN; IT DOES NOT EXECUTE THE AGENT.
#     AC1's own words are "accepted agent run", and AD-22 fixes the bundle at
#     message + agent-run + event. The `AgentRun` is created in AD-7's initial
#     `agent_queued` and never transitioned here: Story 2.5 is what first gives
#     a turn something worth executing (the governed inspect capability), and
#     running one now would need either a live provider on a request path or a
#     test double in production code, plus the registry 2.5 owns. The story
#     requires the queued state be rendered LITERALLY — UX-DR5 forbids
#     anthropomorphic waiting, so no typing indicator, no "Thinking…", no ETA.
# (3) `ActivityItemV1` + `PersistedEventV1` CONTRACTS AND THEIR WRITE/READ SIDES
#     ARE OWNED HERE; STORY 2.4 OWNS THE SSE TRANSPORT. Story 2.1 explicitly
#     deferred both names to 2.3/2.4 but did not split them; settled by what the
#     ACs require — 2.3-AC1 cannot commit a "first persisted activity event"
#     without them, while every 2.4 AC is about the stream (Last-Event-ID,
#     replay, heartbeats, NFR35). The eight `ActivityItemV1` discriminants are
#     defined as a CLOSED vocabulary but only the `planner_message` payload
#     ships — the same "vocabulary that constrains without claiming unproven
#     authority" move Story 2.2 made with AD-5's five risk classes.
# (4) NO IDEMPOTENCY KEY. AD-8/AR8 scope keys to FR-12/16/18/19; FR-4 is NOT in
#     that list and no AC mentions one. AC2's "replayed events never duplicate"
#     is replay dedup by event identity (UX-DR6), a different mechanism.
#     Double-submit is handled by disabling Send while the mutation is pending.
#
# TWO TRAPS THAT FAIL SILENTLY, flagged rather than left to be discovered:
# AD-21 mandates a DECIMAL `sequence`, and serializing it as a JSON number makes
# it an IEEE-754 double in the browser — which breaks Story 2.4's
# `<stream_uuid>:<sequence>` SSE IDs before that story starts. The story requires
# string serialization and a test asserting it. Second: `application/ports/
# scenario_catalogue.py:9` does `from sqlalchemy import Connection` — a real
# pre-existing AD-1 leak sitting right next to the clean
# `scenario_projection.py:104` (`connection: Any`) pattern. The story names
# which to copy, forbids fixing the old one here (Gate A code, out of scope),
# and adds a scoped architecture guard with a DOCUMENTED allow-list entry for
# the known leak — a guard that lies about its coverage is exactly the defect
# the 2.1 review fixed in that file's docstring.
#
# ONE DEFERRED ITEM WAS ASSIGNED HERE BY NAME AND IS DELIBERATELY NOT CLOSED:
# deferred-work.md's `translate.py:61-105` silent-drop item says it "becomes
# reachable once persisted/deserialized turns exist ... belongs to Story 2.3".
# Judged at creation: it does NOT become reachable here, because Decision 2
# means no turn is executed and nothing rehydrates an `AgentTurnV1`. It goes
# live in Story 2.5. The entry stays open; `backend/agent/**` must show a
# ZERO-LINE diff, as it did for Story 2.2.
#
# Scope fences: no SSE, no capability registry, no grounding, no evidence
# navigation, no worker/job queue, no clarification/refusal variants. Only
# `agent_queued` is ever written, so the migration grants no UPDATE on
# `agent_run` — Epic 3 grants it when Epic 3 needs it. Chat code must live in
# `frontend/src/features/chat/`, NOT `features/scenario-data/`, whose directory
# is audited for mutation affordances by `scenarioDataBoundaries.test.ts`.

# NOTE (2026-08-10): Story 2-2 created and moved to ready-for-dev. Second Epic 2
# enabler, ships no planner-visible feature: it builds the MACHINERY every later
# evaluation-bearing story (2.9, 3.10-3.12, 4.5-4.6, 6.4) runs its own cases
# through — case schema, data-driven deterministic-double runner over the real
# Story 2.1 `AgentRuntime` seam, ONE evaluator (tool routing) plus the Protocol
# extension point, an NFR27-bound report generator, and a handful of
# demonstration cases. It fills AR26's `backend/evals/` structural-seed slot,
# which Story 2.1 deliberately left unscaffolded for this story to own.
#
# ONE REAL DESIGN GAP IS FLAGGED IN THE STORY RATHER THAN LEFT TO BE DISCOVERED:
# `evidence_binding.resolve_bindings()` derives BOTH the NFR27 `dataset` and
# `scenario` bindings from the same Gate A `default_fixtures()` list, so all five
# existing evidence files carry near-identical strings for two bindings NFR27
# lists separately. That was correct for Gate A (the thing measured and the
# scenario fixture were the same set) and is NOT correct for an eval report,
# where `dataset` must describe this story's own golden case set and `scenario`
# must describe which Gate A fixture a case actually touched — which for the
# demonstration-tool cases is NONE. Task 5 requires the dev to resolve it and
# record the rationale, with backward compatibility for every existing Gate A
# call site as a hard constraint. `resolve_bindings(fixtures=...)` already
# accepts an override, but passing a synthetic entry there naively still aliases
# the two, so the override alone does not close the gap.
#
# TWO SCOPE FENCES, because this story sits next to a threshold it must not
# chase: (1) NFR28's 50-case / >=4-per-capability / >=10-consequential floor is
# an AGGREGATE measured at Gate B from every proof story's real contribution —
# epics.md's own dataset-threshold caveat says re-verify it, never pad. Task 6
# and 7 forbid padding the demonstration cases toward it, and re-verification is
# named as future work for Story 2.9 / the Gate B report. (2) Only ONE evaluator
# ships (tool routing). The grounding evaluator (NFR12) is Story 2.7's and the
# refusal/injection evaluator is Story 2.9's; this story ships the `Evaluator`
# Protocol they plug into, nothing more.
#
# Seed cases exercise `shiftmind_demonstration` — the only tool Epic 2 has
# today — tagged `capability="demonstration"`, deliberately not a real capability
# name. No fabricated `scheduling_inspect` cases before Story 2.5 builds it.
# VERIFIED AT CREATION: no AD-5 risk-class literal exists anywhere under
# `backend/` yet, so this story defines the five-value vocabulary as a DATASET
# TAG that grants nothing; Story 2.5's registry may later lift it or define its
# own authoritative type. Live coverage REUSES the existing `live` marker and
# `test_gemini_provider.py`'s `_HAS_KEY` skipif shape — no second gating
# mechanism — and AC1's "never authoritative on its own" is required to be true
# of the data shape (a `run_source` discriminant), not just of a CI exclusion.
# `backend/agent/**` and the Story 2.1 port/contracts must show a ZERO-LINE diff:
# this story is a consumer of that seam, not a modifier.

